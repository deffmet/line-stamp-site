<style>
  body{margin:0;padding:0;font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;background-color:#fff8f0;color:#2b1d12}
  .header{background:#fff;border-bottom:2px solid #ffe0b2;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
  .header-title{font-size:17px;font-weight:bold;color:#e65100;margin:0}
  .back-btn{background:#3e2723;color:#fff;text-decoration:none;font-size:12px;font-weight:bold;padding:7px 14px;border-radius:20px}
  .container{max-width:760px;margin:20px auto;padding:0 16px 40px}
  .card{background:#fff;border:2px solid #ffcc80;border-radius:16px;padding:22px 18px;box-shadow:0 4px 14px rgba(230,81,0,0.08)}

  .btn-edit{display:none;background:#3e2723;color:#fff;border:none;padding:7px 14px;border-radius:18px;font-size:12px;font-weight:bold;cursor:pointer}
  .main-img-wrap{text-align:center;background:#fffdf9;border:1px solid #ffe0b2;border-radius:14px;padding:16px;margin-bottom:14px}

  .sub-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}

  .illust-title{font-size:22px;font-weight:bold;margin:0 0 10px;color:#2b1d12}
  .illust-desc{white-space:pre-wrap;font-size:14px;line-height:1.7;background:#fff8f0;padding:14px;border-radius:10px;border:1px solid #ffe0b2;margin-bottom:14px}
  .tags-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .tag-chip{background:#fff3e0;color:#e65100;border:1px solid #ffcc80;font-size:12px;font-weight:bold;padding:4px 10px;border-radius:14px;text-decoration:none}
  .edit-box{display:none;margin-top:18px;padding-top:18px;border-top:2px dashed #ffcc80}
  label{display:block;font-size:12px;font-weight:bold;color:#5d4037;margin:10px 0 4px}
  input[type="text"],textarea{width:100%;padding:10px;border:1px solid #ffcc80;border-radius:8px;box-sizing:border-box;font-size:14px}
  .btn-save{width:100%;margin-top:14px;background:#e65100;color:#fff;border:none;padding:12px;border-radius:20px;font-size:15px;font-weight:bold;cursor:pointer}

  html,body{max-width:100%;overflow-x:hidden}
  .card{box-sizing:border-box;width:100%;overflow:hidden}
  .edit-pick-btn{display:inline-block;width:100%;box-sizing:border-box;background:#fff3e0;color:#e65100;border:1px solid #ffcc80;padding:7px 4px;border-radius:8px;font-size:11px;font-weight:bold;cursor:pointer;text-align:center}
  .edit-sub-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;width:100%}
  .edit-sub-col{display:flex;flex-direction:column;align-items:center;min-width:0}
  .edit-sub-thumb{width:100%;aspect-ratio:1/1;object-fit:contain;border:1px solid #ffe0b2;border-radius:8px;background:#fffdf9;margin-top:6px;box-sizing:border-box}
  .sub-img{
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    pointer-events:auto;
  }


    .report-tri-btn{background:none;border:none;padding:2px 4px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
  .report-tri-btn:hover{opacity:0.8;transform:scale(1.08)}
  .rep-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:999;align-items:center;justify-content:center;padding:16px}
  .rep-overlay.active{display:flex}
  .rep-modal{background:#fff;border:2px solid #ef9a9a;border-radius:16px;padding:20px;width:100%;max-width:440px;box-sizing:border-box}
  .rep-modal select,.rep-modal input,.rep-modal textarea{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #ccc;border-radius:8px;font-size:13px;margin-top:4px}
</style>

<body>

<div class="header">
  <h1 class="header-title">🎨 スタンプ作品詳細</h1>
  <div style="display:flex;gap:8px;align-items:center;">
    <a href="search.html" id="backToSearchBtn" class="back-btn" style="background:#e65100;">🔍 スタンプ検索に戻る</a>
    <a href="index.html" class="back-btn">← トップへ戻る</a>

</div>


<div class="container">

  <!-- ★投稿時に乱数で割り当てられた忍者AdMax広告枠 -->

</div>

</div>
<div class="rep-overlay" id="reportModal">
  <div class="rep-modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <h3 style="margin:0;color:#c62828;font-size:17px;">⚠️ 作品の違反通報</h3>
      <button type="button" onclick="closeReportModal()" style="background:none;border:none;font-size:20px;cursor:pointer;">×</button>
    </div>
    <form id="reportForm">
      <label style="margin-top:4px;">違反カテゴリー（必須）</label>

        <option value="">選択してください</option>
        <option value="著作権侵害・無断転載">著作権侵害・無断転載・トレース</option>
        <option value="センシティブ・不適切な表現">センシティブ・過度に性的・暴力的な表現</option>
        <option value="スパム・不正誘導URL">スパム・詐欺・不正URLへの誘導</option>
        <option value="なりすまし・誹謗中傷・その他">なりすまし・誹謗中傷・その他規約違反</option>
      </select>
      <label>通報内容の詳細（必須）</label>
      <textarea id="repDetail" rows="4" placeholder="具体的な違反箇所や理由をご記入ください" required></textarea>
      <label>控えメール送信先（会員ログイン時は自動入力）</label>
      <input type="email" id="repEmail" placeholder="example@mail.com">

        <button type="button" onclick="closeReportModal()" style="flex:1;background:#757575;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:bold;cursor:pointer;">キャンセル</button>
        <button type="submit" id="repSubmitBtn" style="flex:2;background:#d93025;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:bold;cursor:pointer;">通報を送信する</button>
      </div>
    </form>
  </div>
</div>

  
<script>
  var params = new URLSearchParams(location.search);
  var illustId = params.get("id");
  var currentUser = null;
  try { currentUser = JSON.parse(localStorage.getItem("site_user") || "null"); } catch (e) {}
  var currentItem = null;

  // 端末固有IDの取得・生成（1日1回閲覧・いいね重複防止用）
  function getDeviceId() {
    var did = localStorage.getItem("hs_device_id");
    if (!did) {
      did = "dev_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem("hs_device_id", did);
    }
    return did;
  }

  // 「🔍 スタンプ検索に戻る」の2経路リンク設定
  (function setupBackToSearch() {
    var btn = document.getElementById("backToSearchBtn");
    if (!btn) return;
    var fromSearch = params.get("from_search");
    if (fromSearch && fromSearch !== "1") {
      btn.href = "search.html?" + fromSearch;
    } else if (fromSearch === "1") {
      btn.href = "search.html";
    } else {
      var savedSearch = sessionStorage.getItem("last_illust_search");
      btn.href = savedSearch ? "search.html?" + savedSearch : "search.html";
    }
  })();

  function validateAndCompressSquare(file) {
    return new Promise(function(resolve, reject) {
      if (!file) return resolve("");
      var r = new FileReader();
      r.onload = function(ev) {
        var img = new Image();
        img.onload = function() {
          var w = img.width, h = img.height;
          if (w !== h) return reject("正方形の画像のみ設定可能です（現在 " + w + "×" + h + "px）。");
          if (w < 100 || w > 500) return reject("100×100px 〜 500×500px の範囲にしてください（現在 " + w + "×" + h + "px）。");
          var c = document.createElement("canvas");
          c.width = w; c.height = h;
          c.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL("image/webp", 0.78));
        };
        img.src = ev.target.result;
      };
      r.readAsDataURL(file);
    });
  }

  async function recordViewAndSyncStats(id) {
    try {
      var res = await fetch("/api/illusts/interact", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "view", id: id, deviceId: getDeviceId() })
      });
      var d = await res.json();
      if (d && d.ok) {
        var vEl = document.getElementById("viewCountNum");
        var lEl = document.getElementById("likeCountNum");
        var lBtn = document.getElementById("likeToggleBtn");
        if (vEl) vEl.textContent = d.views;
        if (lEl) lEl.textContent = d.likes;
        if (lBtn) updateLikeButtonStyle(lBtn, d.liked);
      }
    } catch (e) {}
  }

  function updateLikeButtonStyle(btn, liked) {
    var icon = document.getElementById("likeHeartIcon");
    if (liked) {
      btn.style.background = "#ffebee";
      btn.style.borderColor = "#e53935";
      btn.style.color = "#c62828";
      if (icon) icon.textContent = "❤️";
    } else {
      btn.style.background = "#fff";
      btn.style.borderColor = "#ffcc80";
      btn.style.color = "#5d4037";
      if (icon) icon.textContent = "🤍";
    }
  }

  async function toggleLike() {
    if (!currentItem) return;
    var btn = document.getElementById("likeToggleBtn");
    if (btn.disabled) return;
    btn.disabled = true;
    try {
      var res = await fetch("/api/illusts/interact", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "like", id: currentItem.id, deviceId: getDeviceId() })
      });
      var d = await res.json();
      if (d && d.ok) {
        document.getElementById("likeCountNum").textContent = d.likes;
        updateLikeButtonStyle(btn, d.liked);
      }
    } finally {
      btn.disabled = false;
    }
  }

  async function loadDetail() {
    var card = document.getElementById("detailCard");
    if (!illustId) { card.innerHTML = "<p>作品IDが指定されていません。</p>"; return; }
    var isFresh = params.get("fresh") === "1";
    var fetchUrl = "/api/illusts?id=" + encodeURIComponent(illustId) + (isFresh ? "&_t=" + Date.now() : "");
    var res = await fetch(fetchUrl);
    var item = await res.json();
    if (isFresh && history.replaceState) {
      history.replaceState(null, "", "illust_detail.html?id=" + encodeURIComponent(illustId));
    }
    if (!item) { card.innerHTML = "<p>この作品は削除されたか存在しません。</p>"; return; }
    currentItem = item;
    document.title = item.title + " | HookupStickers";

    var isOwner = currentUser && currentUser.uid === item.uid;
    var rawSubs = Array.isArray(item.subImages) ? item.subImages : [];
    var displaySubs = [
      rawSubs[0] || "/Non_file.jpg",
      rawSubs[1] || "/Non_file.jpg",
      rawSubs[2] || "/Non_file.jpg"
    ];

    var subHtml =
      '<div style="text-align:center;font-size:13px;font-weight:bold;color:#e65100;margin:6px 0 10px;">↓ このスタンプのほか</div>' +
      '<div class="sub-grid" oncontextmenu="return false;" ondragstart="return false;" oncopy="return false;">' +
        displaySubs.map(function(s) {
          return '<img src="' + s + '" class="sub-img" alt="サブ画像" draggable="false" oncontextmenu="return false;" ondragstart="return false;">';
        }).join("") +
      '</div>';

    var tagsHtml = (item.tags && item.tags.length > 0)
      ? '<div class="tags-wrap">' + item.tags.map(function(t) { return '<a href="search.html?tag=' + encodeURIComponent(t) + '" class="tag-chip">#' + t.replace(/</g, "&lt;") + '</a>'; }).join("") + '</div>'
      : '';

    // LINEスタンプ公式URL枠の生成（1枚目画像の青枠エリア）
    var stampStatus = item.stampUrlStatus || "";
    var stampUrl = item.stampUrl || "";
    var stampBoxHtml = "";

    if (stampStatus === "approved" && stampUrl) {
      // 承認済み：全員に青リンク表示（入力不可）・本人だけ取り下げボタン表示
      stampBoxHtml =
        '<div style="flex:1;min-width:180px;background:#e3f2fd;border:1px solid #90caf9;border-radius:12px;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px;overflow:hidden;">' +
          '<a href="' + stampUrl.replace(/"/g, "&quot;") + '" target="_blank" rel="noopener" style="color:#1565c0;font-weight:bold;font-size:12px;text-decoration:underline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">🔗 LINEスタンプ購入ページへ ↗</a>' +
          (isOwner ? '<button type="button" onclick="withdrawStampUrl()" style="background:#ef6c00;color:#fff;border:none;padding:4px 8px;border-radius:6px;font-size:10px;font-weight:bold;cursor:pointer;white-space:nowrap;">取り下げ</button>' : '') +
        '</div>';
        } else if (isOwner && stampStatus === "pending") {
      // ★申請中：本会員でも入力欄をグレーアウトしてロックし、横のボタンを押すと取り消し可能にする
      stampBoxHtml =
        '<div style="flex:1;min-width:200px;background:#f5f5f5;border:1px solid #bdbdbd;border-radius:12px;padding:6px 8px;">' +
          '<div style="display:flex;gap:4px;align-items:center;">' +
            '<input type="url" value="' + stampUrl.replace(/"/g, "&quot;") + '" disabled style="flex:1;min-width:0;padding:5px 8px;font-size:11px;border:1px solid #ccc;border-radius:6px;background:#e0e0e0;color:#666;cursor:not-allowed;">' +
            '<button type="button" onclick="withdrawStampUrl()" style="background:#ef6c00;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:bold;cursor:pointer;white-space:nowrap;">申請中（取消）</button>' +
          '</div>' +
          '<div style="font-size:10px;color:#e65100;font-weight:bold;margin-top:3px;">⏳ 運営審査中です（「申請中（取消）」を押すと申請を取り消せます）</div>' +
        '</div>';
    } else if (isOwner) {
      // 未申請・不承認・取り下げ後：入力欄有効＋自動チェッカー＋申請ボタン
      var statusHint = stampStatus === "rejected" ? "❌ 前回の申請は不承認でした（別URLで再申請可）"
        : stampStatus === "withdrawn" ? "⚠️ 取り下げ済み（別URLで再申請可）"
        : "LINE STOREのスタンプ購入URLを入力";
      stampBoxHtml =
        '<div style="flex:1;min-width:200px;background:#fff8f0;border:1px solid #ffcc80;border-radius:12px;padding:6px 8px;">' +
          '<div style="display:flex;gap:4px;align-items:center;">' +
            '<input type="url" id="stampUrlInput" value="" oninput="checkLineStampUrl(this.value)" placeholder="https://line.me..." style="flex:1;min-width:0;padding:5px 8px;font-size:11px;border:1px solid #ffcc80;border-radius:6px;background:#fff;">' +
            '<button type="button" id="stampUrlApplyBtn" disabled onclick="applyStampUrl()" style="background:#bdbdbd;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:bold;cursor:not-allowed;white-space:nowrap;">申請</button>' +
          '</div>' +
          '<div id="stampUrlCheckMsg" style="font-size:10px;color:#795548;margin-top:3px;">' + statusHint + '</div>' +
        '</div>';
    } else {

      // 他会員・未ログイン（未承認時）：グレーアウト状態で入力不可
      stampBoxHtml =
        '<div style="flex:1;min-width:160px;background:#eeeeee;border:1px solid #d0d0d0;border-radius:12px;padding:7px 10px;color:#888;font-size:11px;font-weight:bold;text-align:center;user-select:none;">' +
          '🔒 LINEスタンプURL（未公開・審査待ち）' +
        '</div>';
    }

    var statsBarHtml =
      '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 6px;padding-top:12px;border-top:1px solid #ffe0b2;">' +
        '<button type="button" id="likeToggleBtn" onclick="toggleLike()" style="background:#fff;border:1px solid #ffcc80;color:#5d4037;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:bold;cursor:pointer;display:inline-flex;align-items:center;gap:5px;">' +
          '<span id="likeHeartIcon">🤍</span> いいね <span id="likeCountNum">' + Number(item.likes || 0) + '</span>' +
        '</button>' +
        stampBoxHtml +
        '<div style="font-size:12px;color:#795548;background:#fff8f0;border:1px solid #ffe0b2;padding:5px 12px;border-radius:16px;font-weight:bold;">' +
          '👀 <span id="viewCountNum">' + Number(item.views || 0) + '</span>' +
        '</div>' +
      '</div>';

    // 赤三角に白ビックリマークのSVGアイコン（2枚目画像の右上黒枠位置）
    var reportTriSvg = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,2 23,21 1,21" fill="#d93025"/><rect x="11" y="8" width="2" height="7" fill="#ffffff"/><rect x="11" y="17" width="2" height="2" fill="#ffffff"/></svg>';

    card.innerHTML =
      '<div class="top-bar">' +
        '<a href="/my_page_' + encodeURIComponent(item.username) + '" class="author-link">👤 ' + item.username.replace(/</g, "&lt;") + ' さんのページへ</a>' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
          '<button type="button" class="report-tri-btn" onclick="openReportModal()" title="この作品を通報する">' + reportTriSvg + '</button>' +
          '<span style="font-size:11px;color:#8d6e63;">投稿：' + item.date + '</span>' +
        '</div>' +
      '</div>' +
      (isOwner ? '<div style="text-align:right;margin-bottom:10px;"><button type="button" class="btn-edit" style="display:inline-block;" onclick="toggleEdit()">✏️ 編集する</button></div>' : '') +
      '<div class="main-img-wrap"><img src="' + item.mainImage + '" class="main-img" alt="メイン画像"></div>' +
      subHtml +
      '<h2 class="illust-title">' + item.title.replace(/</g, "&lt;") + '</h2>' +
      (item.description ? '<div class="illust-desc">' + item.description.replace(/</g, "&lt;") + '</div>' : '') +
      tagsHtml +
      statsBarHtml +

      (isOwner ?
        '<div class="edit-box" id="editBox">' +
          '<h3 style="margin:0 0 8px;color:#e65100;font-size:16px;">✏️ 投稿内容を編集する（100×100〜500×500px正方形のみ）</h3>' +
          '<label>作品タイトル（必須）</label>' +
          '<input type="text" id="editTitle" value="' + item.title.replace(/"/g, "&quot;") + '">' +
          '<label>作品の説明欄</label>' +
          '<textarea id="editDesc" rows="4">' + (item.description || "").replace(/</g, "&lt;") + '</textarea>' +
          '<label>ハッシュタグ（スペース区切り）</label>' +
          '<input type="text" id="editTags" value="' + (item.tags || []).map(function(t){return "#" + t;}).join(" ").replace(/"/g, "&quot;") + '">' +
          '<label>メイン画像を差し替える場合のみ選択（100〜500px正方形）</label>' +
          '<input type="file" id="editMainFile" accept="image/png,image/jpeg,image/webp" style="display:none;" onchange="previewEditMain(this)">' +
          '<div style="display:flex;align-items:center;gap:8px;margin-top:4px;">' +
            '<button type="button" class="edit-pick-btn" style="width:auto;padding:7px 14px;" onclick="document.getElementById(\'editMainFile\').click()">🖼️ 画像を選択</button>' +
            '<span id="editMainStatus" style="font-size:11px;color:#795548;">画像未選択</span>' +
          '</div>' +
          '<label>サブ画像 1〜3 を差し替える場合のみ選択（100〜500px正方形）</label>' +
          '<div class="edit-sub-grid">' +
            '<div class="edit-sub-col">' +
              '<input type="file" id="editSub1" accept="image/png,image/jpeg,image/webp" style="display:none;" onchange="previewEditSub(1,this)">' +
              '<button type="button" class="edit-pick-btn" onclick="document.getElementById(\'editSub1\').click()">画像を選択</button>' +
              '<img id="editSubPrev1" src="' + displaySubs[0] + '" class="edit-sub-thumb" alt="サブ1">' +
            '</div>' +
            '<div class="edit-sub-col">' +
              '<input type="file" id="editSub2" accept="image/png,image/jpeg,image/webp" style="display:none;" onchange="previewEditSub(2,this)">' +
              '<button type="button" class="edit-pick-btn" onclick="document.getElementById(\'editSub2\').click()">画像を選択</button>' +
              '<img id="editSubPrev2" src="' + displaySubs[1] + '" class="edit-sub-thumb" alt="サブ2">' +
            '</div>' +
            '<div class="edit-sub-col">' +
              '<input type="file" id="editSub3" accept="image/png,image/jpeg,image/webp" style="display:none;" onchange="previewEditSub(3,this)">' +
              '<button type="button" class="edit-pick-btn" onclick="document.getElementById(\'editSub3\').click()">画像を選択</button>' +
              '<img id="editSubPrev3" src="' + displaySubs[2] + '" class="edit-sub-thumb" alt="サブ3">' +
            '</div>' +
          '</div>' +
          '<button type="button" class="btn-save" id="saveEditBtn" onclick="saveEdit()">変更を保存する</button>' +
        '</div>' : '');

    recordViewAndSyncStats(item.id);
        // 投稿時に乱数決定された3つのAdMax広告のうち1つを表示
    var adScripts = [
      "https://adm.shinobi.jp/s/0e94197c8d60d4eecdf234afeb3d8d2f",
      "https://adm.shinobi.jp/s/2d04db4919ab16066cb4e76b1ff58095",
      "https://adm.shinobi.jp/s/340005cd470b1052d339ef5c0b3e1fd7"
    ];
    var chosenSlot = (typeof item.adSlot === "number" && item.adSlot >= 0 && item.adSlot <= 2)
      ? item.adSlot
      : (Number(item.id || 0) % 3);
    var adBox = document.getElementById("illustAdContainer");
    if (adBox && !adBox.dataset.loaded) {
      adBox.dataset.loaded = "1";
      var adSc = document.createElement("script");
      adSc.src = adScripts[chosenSlot];
      adBox.appendChild(adSc);
    }

  }

  async function previewEditMain(input) {
    var f = input.files && input.files.item(0);
var st = document.getElementById("editMainStatus");
if (!f) { st.textContent = "画像未選択"; return; }
try {
await validateAndCompressSquare(f);
st.textContent = f.name;
} catch (err) {
alert("⚠️ " + err);
input.value = "";
st.textContent = "画像未選択";
}
}
async function previewEditSub(idx, input) {
var f = input.files && input.files.item(0);
if (!f) return;
try {
var url = await validateAndCompressSquare(f);
document.getElementById("editSubPrev" + idx).src = url;
} catch (err) {
alert("⚠️ サブ" + idx + "：" + err);
input.value = "";
}
}
function toggleEdit() {
var box = document.getElementById("editBox");
if (!box) return;
box.style.display = "block";
box.scrollIntoView({ behavior: "smooth", block: "start" });
setTimeout(function() {
var desc = document.getElementById("editDesc");
if (desc) desc.focus();
}, 450);
}
async function saveEdit() {
var btn = document.getElementById("saveEditBtn");
var newTitle = document.getElementById("editTitle").value.trim();
if (!newTitle) { alert("タイトルは必須です"); return; }
if (!confirm("編集結果を保存してもいいですか？\n（「OK」で上書き保存、「キャンセル」で編集画面に戻ります）")) {
return;
}
btn.disabled = true; btn.textContent = "検証・保存中...";
try {
var f = document.getElementById("editMainFile").files.item(0);
var newImg = f ? await validateAndCompressSquare(f) : "";
var curSubs = Array.isArray(currentItem.subImages) ? currentItem.subImages.slice() : ["/Non_file.jpg", "/Non_file.jpg", "/Non_file.jpg"];
while (curSubs.length < 3) curSubs.push("/Non_file.jpg");
for (var i = 1; i <= 3; i++) {
var sf = document.getElementById("editSub" + i).files.item(0);
if (sf) curSubs[i - 1] = await validateAndCompressSquare(sf);
}
var res = await fetch("/api/illusts", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
action: "edit",
id: currentItem.id,
uid: currentUser.uid,
title: newTitle,
description: document.getElementById("editDesc").value,
tags: document.getElementById("editTags").value,
mainImage: newImg,
subImages: curSubs
})
});
var d = await res.json();
if (res.ok && d.ok) {
alert("更新しました！");
location.href = "illust_detail.html?id=" + encodeURIComponent(currentItem.id) + "&fresh=1";
} else {
alert(d.error || "更新に失敗しました");
}
} catch (err) {
alert("⚠️ " + (typeof err === "string" ? err : "エラーが発生しました"));
} finally {
btn.disabled = false; btn.textContent = "変更を保存する";
}
}
    // LINEスタンプ公式URL自動チェッカー
  function isOfficialLineStampUrl(val) {
    var s = String(val || "").trim();
    return /^https:\/\/(store\.line\.me\/stickershop\/product\/|line\.me\/S\/sticker\/)[a-zA-Z0-9_\-\/\?\=\&\%]+$/i.test(s);
  }

  function checkLineStampUrl(val) {
    var btn = document.getElementById("stampUrlApplyBtn");
    var msg = document.getElementById("stampUrlCheckMsg");
    if (!btn || !msg) return;
    if (isOfficialLineStampUrl(val)) {
      btn.disabled = false;
      btn.style.background = "#06c755";
      btn.style.cursor = "pointer";
      msg.style.color = "#2e7d32";
      msg.textContent = "✅ LINEスタンプ公式URLを確認しました！申請できます";
    } else {
      btn.disabled = true;
      btn.style.background = "#bdbdbd";
      btn.style.cursor = "not-allowed";
      msg.style.color = "#c62828";
      msg.textContent = val.trim() ? "⚠️ https://line.me... の公式URLのみ有効です" : "LINE STOREのスタンプ購入URLを入力";
    }
  }

  async function applyStampUrl() {
    var input = document.getElementById("stampUrlInput");
    if (!input || !isOfficialLineStampUrl(input.value)) return;
    if (!confirm("このLINEスタンプ公式URLを運営審査に申請しますか？")) return;
    var btn = document.getElementById("stampUrlApplyBtn");
    btn.disabled = true;
    var res = await fetch("/api/illusts/stamp-url", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "apply", illustId: currentItem.id, uid: currentUser.uid, stampUrl: input.value.trim() })
    });
    if (res.ok) {
      alert("LINEスタンプURLの審査申請を送信しました！運営承認後に公開されます。");
      location.href = "illust_detail.html?id=" + encodeURIComponent(currentItem.id) + "&fresh=1";
    } else {
      alert("申請に失敗しました。");
      btn.disabled = false;
    }
  }

  async function withdrawStampUrl() {
    if (!confirm("公開中のLINEスタンプURLを取り下げますか？（運営審査ページにも取り下げ報告が送信されます）")) return;
    var res = await fetch("/api/illusts/stamp-url", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "withdraw", illustId: currentItem.id, uid: currentUser.uid })
    });
    if (res.ok) {
      alert("URLを取り下げました。別の公式URLで再申請することも可能です。");
      location.href = "illust_detail.html?id=" + encodeURIComponent(currentItem.id) + "&fresh=1";
    }
  }

  // 通報ダイアログ制御＆送信（控えメール自動送信連動）
  function openReportModal() {
    var emailInput = document.getElementById("repEmail");
    if (emailInput && currentUser && currentUser.email) {
      emailInput.value = currentUser.email;
    }
    document.getElementById("reportModal").classList.add("active");
  }

  function closeReportModal() {
    document.getElementById("reportModal").classList.remove("active");
  }

  document.getElementById("reportForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    if (!currentItem) return;
    var btn = document.getElementById("repSubmitBtn");
    btn.disabled = true; btn.textContent = "送信中...";
    try {
      var res = await fetch("/api/report-illust", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          illustId: currentItem.id,
          illustTitle: currentItem.title,
          targetUid: currentItem.uid,
          targetUsername: currentItem.username,
          reporterUid: currentUser ? currentUser.uid : "未ログイン（" + getDeviceId() + "）",
          reporterUsername: currentUser ? currentUser.username : "ゲスト",
          reporterEmail: document.getElementById("repEmail").value.trim(),
          category: document.getElementById("repCategory").value,
          detail: document.getElementById("repDetail").value.trim()
        })
      });
      if (res.ok) {
        alert("ご協力のほどありがとうございます。\n通報を受け付け、控えメールを送信いたしました。");
        document.getElementById("reportForm").reset();
        closeReportModal();
      } else {
        alert("送信に失敗しました。時間をおいて再度お試しください。");
      }
    } finally {
      btn.disabled = false; btn.textContent = "通報を送信する";
    }
  });

  loadDetail();
</script>
