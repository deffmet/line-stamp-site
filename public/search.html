<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イラスト検索結果 | HookupStickers</title>
<link rel="icon" href="/icon.png?v=5" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="/icon.png?v=5">
<style>
  body{margin:0;padding:0;font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;background-color:#fff8f0;color:#2b1d12}
  .header{background:#fff;border-bottom:2px solid #ffe0b2;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
  .header-title{font-size:17px;font-weight:bold;color:#e65100;margin:0}
  .back-btn{background:#3e2723;color:#fff;text-decoration:none;font-size:12px;font-weight:bold;padding:7px 14px;border-radius:20px}
  .container{max-width:1100px;margin:18px auto;padding:0 16px 40px}

  .search-panel{background:#fff;border:2px solid #ffcc80;border-radius:14px;padding:14px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .search-input{flex:1;min-width:180px;padding:10px 14px;border:1px solid #ffcc80;border-radius:20px;font-size:14px;background:#fffdf9}
  .sort-select{padding:10px 12px;border:1px solid #ffcc80;border-radius:20px;font-size:13px;background:#fff;color:#3e2723;font-weight:bold}
  .btn-search{background:#e65100;color:#fff;border:none;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:bold;cursor:pointer}

  .status-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px;color:#5d4037;font-weight:bold}
  .active-tag-badge{display:none;background:#e65100;color:#fff;padding:4px 12px;border-radius:16px;font-size:12px;cursor:pointer}

  /* PCは5列、タブレットは4列、スマホは3列のレスポンシブ配列（500x500px自動リサイズ） */
  .illust-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  @media (max-width: 900px) { .illust-grid{grid-template-columns:repeat(4,1fr);gap:12px} }
  @media (max-width: 600px) { .illust-grid{grid-template-columns:repeat(3,1fr);gap:8px} }

  .illust-card{background:#fff;border:1px solid #ffe0b2;border-radius:12px;padding:8px;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform 0.15s,box-shadow 0.15s}
  .illust-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(230,81,0,0.15)}
  .thumb-box{width:100%;aspect-ratio:1/1;background:#fffdf9;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .thumb-box img{width:100%;height:100%;object-fit:contain;display:block}
  .card-title{font-size:12px;font-weight:bold;margin:8px 0 4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-author{font-size:10px;color:#8d6e63;margin-top:auto}
</style>
</head>
<body>

<div class="header">
  <h1 class="header-title">🔍 イラスト検索</h1>
  <a href="index.html" class="back-btn">← トップへ戻る</a>
</div>

<div class="container">
  <form class="search-panel" id="searchForm">
    <input type="text" id="qInput" class="search-input" placeholder="タイトル・ハッシュタグ・クリエイター名で検索">
    <select id="sortSelect" class="sort-select" onchange="runSearch()">
      <option value="newest">新着順</option>
      <option value="oldest">古い順</option>
    </select>
    <button type="submit" class="btn-search">検索</button>
  </form>

  <div class="status-bar">
    <span id="resultCountText">読み込み中...</span>
    <span id="activeTagBadge" class="active-tag-badge" onclick="clearTagFilter()"></span>
  </div>

  <div class="illust-grid" id="illustGrid"></div>
</div>
<script>
  var params = new URLSearchParams(location.search);
  var currentTag = params.get("tag") || "";
  var initialQ = params.get("q") || "";
  document.getElementById("qInput").value = initialQ;

  function updateTagBadge() {
    var badge = document.getElementById("activeTagBadge");
    if (currentTag) {
      badge.textContent = "#" + currentTag + " × 解除";
      badge.style.display = "inline-block";
    } else {
      badge.style.display = "none";
    }
  }

  function clearTagFilter() {
    currentTag = "";
    updateTagBadge();
    runSearch();
  }

  async function runSearch() {
    var q = document.getElementById("qInput").value.trim();
    var sort = document.getElementById("sortSelect").value;
    var countEl = document.getElementById("resultCountText");
    var gridEl = document.getElementById("illustGrid");
    countEl.textContent = "検索中...";

    var url = "/api/illusts?q=" + encodeURIComponent(q) + "&tag=" + encodeURIComponent(currentTag) + "&sort=" + encodeURIComponent(sort);
    var res = await fetch(url);
    var items = await res.json();

    countEl.textContent = "検索結果：" + items.length + " 件";
    if (items.length === 0) {
      gridEl.innerHTML = '<div style="grid-column:1/-1;background:#fff;border:1px dashed #ffcc80;border-radius:12px;padding:36px;text-align:center;color:#8d6e63;font-size:14px;">条件に一致するスタンプイラストが見つかりませんでした。</div>';
      return;
    }

    gridEl.innerHTML = items.map(function(item) {
      return '<a href="illust_detail.html?id=' + encodeURIComponent(item.id) + '" class="illust-card">' +
        '<div class="thumb-box"><img src="' + item.mainImage + '" alt="' + item.title.replace(/"/g, "&quot;") + '" loading="lazy"></div>' +
        '<div class="card-title">' + item.title.replace(/</g, "&lt;") + '</div>' +
        '<div class="card-author">👤 ' + item.username.replace(/</g, "&lt;") + '</div>' +
      '</a>';
    }).join("");
  }

  document.getElementById("searchForm").addEventListener("submit", function(e) {
    e.preventDefault();
    runSearch();
  });

  updateTagBadge();
  runSearch();
</script>
</body>
</html>
